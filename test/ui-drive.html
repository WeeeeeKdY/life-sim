<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ui-drive</title>
<style>
  body { background:#111; color:#ddd; font: 13px/1.7 monospace; margin:0; padding:16px; }
  iframe { position:fixed; left:-2000px; top:0; width:420px; height:900px; border:0; }
  .pass { color:#7bd88f; } .fail { color:#ff7b7b; font-weight:bold; }
</style>
</head>
<body>
<pre id="report">running…</pre>
<iframe id="fr" src="../index.html"></iframe>
<script>
(function () {
  var out = [];
  var fails = 0;
  function log(ok, msg) {
    if (!ok) fails++;
    out.push((ok ? 'PASS  ' : 'FAIL  ') + msg);
    document.getElementById('report').innerHTML = out.join('\n');
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function run() {
    var fr = document.getElementById('fr');
    var d = fr.contentDocument;
    var w = fr.contentWindow;

    var $ = function (id) { return d.getElementById(id); };
    var choiceOn = function () { return $('choiceList').classList.contains('on'); };
    var choiceBtns = function () { return d.querySelectorAll('#choiceList .choice'); };

    /* ---------- 1. 开始页 ---------- */
    log($('screen-start').classList.contains('active'), '启动落在开始页');
    log(/第一次|已经活过/.test($('startStats').textContent), '开始页统计已渲染');

    /* ---------- 2. 天赋页 ---------- */
    $('btnStart').click();
    var cards = d.querySelectorAll('#talentList .card');
    log($('screen-talent').classList.contains('active'), '进入天赋页');
    log(cards.length === 10, '抽出 10 张天赋卡（实际 ' + cards.length + '）');
    log($('btnTalentNext').disabled === true, '未选满 3 个时下一步禁用');

    cards[0].click(); cards[1].click(); cards[2].click();
    log($('talentCount').textContent === '3', '选满计数显示 3');
    log($('btnTalentNext').disabled === false, '选满 3 个后下一步可用');
    cards[3].click();
    log($('talentCount').textContent === '3', '第 4 个不会被选上（上限生效）');
    cards[2].click();
    log($('talentCount').textContent === '2', '再点一次可取消选择');
    cards[2].click();
    log($('talentCount').textContent === '3', '取消后能重新选回');

    /* ---------- 3. 属性页 ---------- */
    $('btnTalentNext').click();
    log($('screen-attr').classList.contains('active'), '进入属性页');
    log($('pointsLeft').textContent === '20', '初始可用点数 20');
    log($('btnLive').disabled === true, '点数没分完时不能开始');

    var plus = d.querySelectorAll('#attrList [data-act="plus"]');
    for (var i = 0; i < 20; i++) plus[i % 4].click();
    log($('pointsLeft').textContent === '0', '手动加满 20 点后剩余 0');
    log($('btnLive').disabled === false, '分完点数后可以开始');

    var vals = [].map.call(d.querySelectorAll('#attrList .attr-val'), function (e) { return Number(e.textContent); });
    log(vals.reduce(function (a, b) { return a + b; }, 0) === 20, '四项属性之和等于 20（' + vals.join('/') + '）');
    log(vals.every(function (v) { return v >= 0 && v <= 10; }), '单项属性都在 0~10 之间');

    /* ---------- 4. 人生页 ---------- */
    $('btnLive').click();
    log($('screen-life').classList.contains('active'), '进入人生页');
    var logs = d.querySelectorAll('#logList .entry');
    log(logs.length === 1, '出生记录已写入（' + logs.length + ' 条）');
    log(/出生/.test(logs[0].textContent), '第一条是出生事件');
    log($('ageNum').textContent === '0', '年龄从 0 岁开始（实际 ' + $('ageNum').textContent + '）');
    log(!choiceOn(), '刚出生时没有选项面板');
    log($('btnNext').disabled === false, '下一年按钮可用');
    log($('btnNext').textContent === '下一年', '按钮文案是「下一年」');

    /* ---------- 5. 走到第一个选项 ---------- */
    var guard = 0;
    while (!choiceOn() && guard < 60) {
      if ($('btnNext').disabled) break;
      $('btnNext').click();
      guard++;
    }
    log(choiceOn(), '推进若干年后弹出选项面板（用了 ' + guard + ' 次下一年）');
    var n = choiceBtns().length;
    log(n >= 2, '选项面板至少 2 个选项（实际 ' + n + '）');
    log($('choiceList').querySelectorAll('.choice-num').length === n, '每个选项都带序号');

    var texts = [].map.call(choiceBtns(), function (b) {
      return b.querySelector('.choice-text').textContent.trim();
    });
    log(texts.every(function (t) { return t.length > 0; }), '选项文案都不为空');

    /* ---------- 6. 待选时必须卡住 ---------- */
    var logsBefore = d.querySelectorAll('#logList .entry').length;
    log($('btnNext').disabled === true, '待选时「下一年」被禁用');
    log($('btnSkip').disabled === true, '待选时「过完一生」被禁用');
    log($('btnAuto').disabled === false, '待选时「自动」仍可点（允许随时暂停）');
    log($('btnNext').textContent === '请先选择', '待选时按钮提示「请先选择」');

    $('btnNext').click();
    $('btnNext').click();
    var logsAfter = d.querySelectorAll('#logList .entry').length;
    log(logsAfter === logsBefore, '待选时点「下一年」不会推进（' + logsBefore + '→' + logsAfter + '）');
    log(choiceOn(), '待选状态仍然保持着');

    /* ---------- 7. 选择后结算 ---------- */
    var choiceText = texts[0];
    choiceBtns()[0].click();

    log(!choiceOn(), '选完后选项面板收起');
    var last = d.querySelectorAll('#logList .entry');
    var lastEl = last[last.length - 1];
    log(/entry-choice/.test(lastEl.innerHTML), '日志里回显了「你选择了…」');
    log(lastEl.querySelector('.entry-choice').textContent.indexOf(choiceText) >= 0, '回显的选择文本与点击的一致');
    log($('btnNext').disabled === false, '选完后「下一年」恢复可用');
    log(d.querySelectorAll('#logList .entry').length === logsAfter, '选择不会额外增加日志条数');

    /* ---------- 8. 数字键选择 ---------- */
    guard = 0;
    while (!choiceOn() && guard < 60) {
      if ($('btnNext').disabled) break;
      $('btnNext').click();
      guard++;
    }
    if (choiceOn()) {
      var before = d.querySelectorAll('#choiceList .choice').length;
      d.dispatchEvent(new w.KeyboardEvent('keydown', { key: '1', bubbles: true }));
      log(!choiceOn(), '数字键 1 能直接选中第一个选项');
      var lastEl2 = (function () {
        var all = d.querySelectorAll('#logList .entry');
        return all[all.length - 1];
      })();
      log(/entry-choice/.test(lastEl2.innerHTML), '数字键选择同样写入了日志');
    } else {
      log(false, '数字键测试未取得选项面板');
    }

    /* ---------- 9. 自动播放 ---------- */
    var ageBefore = Number($('ageNum').textContent);
    $('btnAuto').click();
    log($('btnAuto').textContent === '暂停', '自动播放按钮切成「暂停」');
    return wait(2600).then(function () {
      var ageAfter = Number($('ageNum').textContent);
      log(ageAfter > ageBefore, '自动播放推进了年龄（' + ageBefore + ' → ' + ageAfter + '）');
      $('btnAuto').click();
      log($('btnAuto').textContent === '自动', '再点一次恢复「自动」');

      /* ---------- 10. 过完一生 ---------- */
      if ($('btnSkip').disabled) {
        // 可能正卡在待选，先选一个
        if (choiceOn()) choiceBtns()[0].click();
      }
      $('btnSkip').click();
      return wait(400).then(function () {
        log($('screen-end').classList.contains('active'), '过完一生后进入结算页');
        var txt = $('endWrap').textContent;
        log(/评级\s*[SABCDE]/.test(txt), '结算页显示了评级');
        log(/享年/.test(txt), '结算页显示了享年');
        log(/最终属性/.test(txt), '结算页显示了最终属性');
        log(/次选择/.test(txt), '结算页显示了选择次数');
        var finalVs = d.querySelectorAll('#endWrap .final-attr .v');
        log(finalVs.length === 4, '最终属性四项齐全');
        log(![].some.call(finalVs, function (e) { return !/^\d+$/.test(e.textContent.trim()); }), '最终属性都是整数');

        // 结束时不该还留着选项面板
        log(!choiceOn(), '结算页没有残留的选项面板');

        var lives = Number(w.localStorage.getItem('life.lives'));
        log(lives >= 1, 'localStorage 记录了已活次数（' + lives + '）');

        /* ---------- 11. 重开 ---------- */
        $('btnRestart').click();
        log($('screen-talent').classList.contains('active'), '再来一次回到天赋页');
        log(d.querySelectorAll('#talentList .card').length === 10, '重开重新抽了 10 张');

        document.title = fails === 0 ? 'ALL-PASS' : 'HAS-FAIL';
        out.push('');
        out.push(fails === 0 ? '=== 全部通过 ===' : '=== ' + fails + ' 项失败 ===');
        document.getElementById('report').innerHTML = out.join('\n');
      });
    });
  }

  document.getElementById('fr').addEventListener('load', function () {
    setTimeout(function () {
      var p;
      try { p = run(); } catch (e) {
        log(false, '运行时异常: ' + e.message);
        document.title = 'HAS-FAIL';
      }
      Promise.resolve(p).catch(function (e) {
        log(false, '异步异常: ' + e.message);
        document.title = 'HAS-FAIL';
      });
    }, 200);
  });
})();
</script>
</body>
</html>
